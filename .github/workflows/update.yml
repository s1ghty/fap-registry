name: Update packages

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Repackage this one tracked package even if its version hasn't changed (e.g. after a package.sh change) — leave blank for a normal run"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zstd
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run update.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_NAME: ${{ github.event.inputs.force }}
        run: |
          if [ -n "$FORCE_NAME" ]; then
            ./update.sh --force "$FORCE_NAME"
          else
            ./update.sh
          fi

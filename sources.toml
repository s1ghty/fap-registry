# sources.toml — upstream releases tracked by update.sh.
#
# Each [[package]] row maps one stable.json entry to the upstream repo or
# URL it's built from, so update.sh can check for a newer release and
# repackage it automatically. If a row's "name" isn't in stable.json yet,
# update.sh adds it as a new package.
#
# Fields:
#   name             stable.json package name (must match exactly)
#   repo             upstream "owner/repo" on GitHub (see "Where the
#                    upstream lives" below for the alternative)
#   bin              binary name inside the package's bin/ directory
#   platform         platform suffix used in the artifact filename/tag (optional)
#   description      stable.json description field (optional)
#   version_prefix   prefix stripped from the release tag/version to get
#                    the recorded version (optional, e.g. tag "jq-1.8.2"
#                    with version_prefix "jq-" -> "1.8.2"; also applies to
#                    a version_url-sourced version, e.g. neovim-style tag
#                    "v0.12.4" with version_prefix "v" -> "0.12.4")
#   desktop_type     register an XDG .desktop entry at install time:
#                    "application" (app launcher/menu visibility, e.g.
#                    fuzzel/rofi finding it), "x11-session", or
#                    "wayland-session" (selectable at a display manager's
#                    login screen — system-mode installs only). Optional;
#                    most packages set none (plain binary, no desktop
#                    entry at all).
#   desktop_name     display name for the desktop entry (optional,
#                    defaults to "name" if desktop_type is set but this
#                    isn't)
#
# Where the upstream lives — exactly one of these two:
#
#   1. GitHub releases (most packages). Set "repo" to "owner/repo";
#      update.sh checks its latest release via the GitHub API. Combine
#      with "pin_tag" (a real git tag) to build_from_source that exact
#      tag instead of whatever's actually latest — for when a newer
#      release needs a dependency version this CI runner can't satisfy
#      (see sway below). Only ever repackaged again if pin_tag itself
#      changes; not valid without build_from_source = "true".
#
#   2. Anywhere else. Set "version_url" to a URL whose response tells you
#      the latest version — either the whole trimmed response body (if
#      it's already just a bare version string), or a JSON field
#      extracted via "version_jq" (a jq filter, e.g. ".some.field"). Set
#      "url_template" to the actual download URL, containing the literal
#      text "{version}" wherever the version number goes — update.sh
#      substitutes it in after determining the version. This is Firefox's
#      shape below: Mozilla doesn't publish on GitHub at all, so its
#      version comes from Mozilla's own product-details JSON API, and the
#      download URL is built from a template instead of picked out of a
#      release's asset list (there's no such list off GitHub — the
#      constructed URL is the one and only download).
#      Not yet combinable with build_from_source (see below) — only a
#      GitHub checkout can be built from source right now.
#
# How the binary is obtained once you know where it lives — three modes:
#
#   1. Direct binary asset (default). Set "asset" to a release asset
#      filename that IS the binary itself, downloaded as-is. This is jq's
#      shape below: "jq-linux-amd64" is a raw executable, no archive.
#
#   2. Archive asset. Set "asset" to a release asset filename that's an
#      archive (.tar.gz/.tar.xz/.tar.zst/...), and "bin_path" to the
#      binary's path inside it once extracted. This is fastfetch's shape
#      below: the release ships a .tar.gz with the binary nested inside.
#
#   3. Build from source. Set "build_from_source" to "true" instead of
#      setting "asset" at all. update.sh shallow-clones "repo" at the
#      release tag, runs "build_cmd" inside it (installing "build_deps" via
#      apt first, if set), and expects the resulting binary at "bin_path"
#      relative to the clone root. For projects like htop that don't
#      publish a prebuilt Linux binary at all.
#
# Set "tree" = "true" (combinable with mode 2 or 3 above) for an app that
# ships a resource directory alongside its binary — neovim's
# share/nvim/runtime/, Firefox's bundled locale/plugin files — not just a
# self-contained single binary. The whole extracted archive (or built
# source tree) is preserved as-is instead of packaging just one file;
# "bin_path" becomes the entry point's path within that tree rather than
# the one binary to extract. "bin" is unused in this mode (the installed
# command name is always the basename of "bin_path" — see
# install.c's resolve_pkg_entry()).

[[package]]
name = "jq"
repo = "jqlang/jq"
asset = "jq-linux-amd64"
bin = "jq"
platform = "linux-x86_64"
description = "Command-line JSON processor (Linux x86_64 static binary)"
version_prefix = "jq-"

[[package]]
name = "fastfetch"
repo = "fastfetch-cli/fastfetch"
asset = "fastfetch-linux-amd64.tar.gz"
bin_path = "fastfetch-linux-amd64/usr/bin/fastfetch"
bin = "fastfetch"
platform = "linux-x86_64"
description = "Feature-rich, performance-oriented system information tool (Linux x86_64)"

[[package]]
name = "htop"
repo = "htop-dev/htop"
build_from_source = "true"
build_deps = "libncursesw5-dev autoconf automake pkg-config"
build_cmd = "./autogen.sh && ./configure && make"
bin_path = "htop"
bin = "htop"
platform = "linux-x86_64"
description = "Interactive process viewer (Linux x86_64, built from source)"

# BtbN/FFmpeg-Builds is a well-known community build repo (upstream
# FFmpeg itself doesn't publish Linux binaries), and reuses a single
# rolling "latest" tag for every build rather than real version
# numbers — doesn't fit update.sh's version-diffing model, so this
# packages once (recorded version will literally be "latest") and
# then stays pinned until manually refreshed with
# `./update.sh --force ffmpeg`, rather than repackaging a ~130MB
# archive on every scheduled run for a tag that never looks different.
[[package]]
name = "ffmpeg"
repo = "BtbN/FFmpeg-Builds"
asset = "ffmpeg-master-latest-linux64-gpl.tar.xz"
bin_path = "ffmpeg-master-latest-linux64-gpl/bin/ffmpeg"
bin = "ffmpeg"
platform = "linux-x86_64"
description = "Complete, cross-platform solution to record, convert, and stream audio and video (Linux x86_64, GPL build)"

# First tree-mode package: neovim's release ships bin/nvim alongside a
# share/nvim/runtime/ directory (colorschemes, syntax files, filetype
# detection, ...) that the binary needs at a fixed relative path to
# itself, not just a self-contained executable.
[[package]]
name = "neovim"
repo = "neovim/neovim"
asset = "nvim-linux-x86_64.tar.gz"
tree = "true"
bin_path = "nvim-linux-x86_64/bin/nvim"
platform = "linux-x86_64"
description = "Hyperextensible Vim-based text editor"
version_prefix = "v"

# First version_url package: Mozilla doesn't host Firefox on GitHub at
# all, so there's no releases API to check. LATEST_FIREFOX_VERSION comes
# from Mozilla's own product-details endpoint (a clean "154.0"-style
# string, no prefix needed); url_template builds the real download URL
# from it. Also tree-mode: Firefox's own tarball has no bin/ subdirectory
# at all — "firefox" sits flat inside "firefox/" alongside omni.ja,
# libxul.so, and everything else it needs, all resolved relative to the
# binary's own location the same way neovim's runtime dir is.
[[package]]
name = "firefox"
version_url = "https://product-details.mozilla.org/1.0/firefox_versions.json"
version_jq = ".LATEST_FIREFOX_VERSION"
url_template = "https://download-installer.cdn.mozilla.net/pub/firefox/releases/{version}/linux-x86_64/en-US/firefox-{version}.tar.xz"
tree = "true"
bin_path = "firefox/firefox"
platform = "linux-x86_64"
description = "Fast, private, and safe web browser"
desktop_type = "application"
desktop_name = "Firefox"

# First WM/compositor, and first use of pin_tag: sway's actual latest
# release (1.12) needs wlroots >=0.20.0, but Ubuntu 24.04 (the CI
# runner) only has wlroots 0.17.1 available via apt, with no vendored
# fallback in sway's own repo — that build would fail outright at
# `meson setup`. sway 1.9 requires wlroots >=0.17.0,<0.18.0, an exact
# match for what's actually installable here, so this is pinned to 1.9
# specifically for CI-buildability, not upstream freshness (checked
# meson.build's wlroots_version constraint directly for both tags
# before picking one, not guessed). Launch directly from a TTY — no
# display manager or X11 needed, sway is a Wayland compositor.
[[package]]
name = "sway"
repo = "swaywm/sway"
pin_tag = "1.9"
build_from_source = "true"
build_deps = "meson ninja-build pkg-config libwlroots-dev libwayland-dev wayland-protocols libxkbcommon-dev libjson-c-dev libpcre2-dev libcairo2-dev libpango1.0-dev libpixman-1-dev libevdev-dev libdrm-dev libinput-dev libudev-dev libxcb1-dev libxcb-icccm4-dev libsystemd-dev libgdk-pixbuf-2.0-dev scdoc"
build_cmd = "meson setup build && ninja -C build"
bin_path = "build/sway/sway"
bin = "sway"
platform = "linux-x86_64"
description = "i3-compatible tiling Wayland compositor (built from source, pinned to 1.9 for wlroots compatibility)"
desktop_type = "wayland-session"
desktop_name = "Sway"
